services:
  mongo:
    image: mongo:7
    command: ["mongod", "--bind_ip_all", "--noauth", "--replSet", "kotatsu"]
    restart: unless-stopped
    volumes:
      - ./.docker-data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok && db.hello().isWritablePrimary } catch (e) { rs.initiate({_id:'kotatsu',members:[{_id:0,host:'mongo:27017'}]}).ok; false }"]
      interval: 10s
      timeout: 5s
      retries: 6
    # No published ports and no authentication: reachable only by service name
    # (mongo) on this compose project's private network.
  server:
    image: ${KOTATSU_IMAGE:-ghcr.io/koboshchan/kotatsu:${KOTATSU_RELEASE_VERSION:-latest}}
    # Prefer pre-built Docker image; build from context when needed (--build)
    build:
      context: .
      args:
        VERSION: ${KOTATSU_RELEASE_VERSION:-dev}
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      KOTATSU_LISTEN: 0.0.0.0:8080
      KOTATSU_MONGO_URI: mongodb://mongo:27017/kotatsu?replicaSet=kotatsu
      KOTATSU_MONGO_DB: kotatsu
      KOTATSU_PUBLIC_URL: ${KOTATSU_PUBLIC_URL:?Set the public HTTPS origin}
      KOTATSU_DEV: ${KOTATSU_DEV:-0}
      KOTATSU_TRUSTED_PROXIES: ${KOTATSU_TRUSTED_PROXIES:-}
      KOTATSU_RELEASE_VERSION: ${KOTATSU_RELEASE_VERSION:?Set a pinned release tag}
      KOTATSU_RELEASE_URL: ${KOTATSU_RELEASE_URL:?Set the HTTPS release origin}
    ports:
      - "127.0.0.1:${KOTATSU_PORT:-28473}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/kotatsu-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s
